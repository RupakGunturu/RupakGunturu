<svg xmlns="http://www.w3.org/2000/svg" width="122" height="36" viewBox="0 0 122 36" role="img" aria-label="Portfolio">
  <defs>
    <linearGradient id="pf-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pf-clip">
      <rect x="0" y="0" width="122" height="36" rx="7"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pf-clip)">
    <rect x="0" y="0" width="122" height="36" rx="7" fill="#ffffff"/>
    <rect x="-56" y="0" width="46" height="36" fill="url(#pf-shine)" opacity="0.45">
      <animate attributeName="x" values="-56;136" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0.5" y="0.5" width="121" height="35" rx="6.5" fill="none" stroke="#cbd5e1"/>
  </g>

  <image x="13.0" y="9.62" width="22.0" height="16.76" href="data:image/png;base64,"/>

  <text x="41" y="23" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.2" fill="#0f172a">Portfolio</text>
</svg>
